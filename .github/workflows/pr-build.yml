name: PR Build → Zealot

# Every PR push builds an ad hoc IPA with bundle ID visceralorigami.JumpTuner.pr<N>
# (home-screen name "JT PR<N>") and uploads it to the self-hosted Zealot at
# https://zealot.jeffro.dev, so several PR builds can be installed side by side.
# Merges to main go to TestFlight instead (main-beta.yml).

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zealot:
    name: Ad hoc build → Zealot
    runs-on: macos-latest
    # Fork PRs never get secrets; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check secrets configured
        id: secrets
        env:
          CONFIGURED: ${{ secrets.DIST_CERTIFICATE_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ZEALOT_TOKEN != '' && secrets.TS_OAUTH_CLIENT_ID != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURED" != "true" ]; then
            echo "::notice::Zealot/Tailscale secrets not configured — skipping PR build."
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Select Xcode 26
        if: steps.secrets.outputs.configured == 'true'
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)

      - name: Set up Ruby
        if: steps.secrets.outputs.configured == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Import distribution certificate
        if: steps.secrets.outputs.configured == 'true'
        env:
          DIST_CERTIFICATE_BASE64: ${{ secrets.DIST_CERTIFICATE_BASE64 }}
          DIST_CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          echo "$DIST_CERTIFICATE_BASE64" | base64 --decode > /tmp/dist_cert.p12
          security import /tmp/dist_cert.p12 -k build.keychain \
            -P "$DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/dist_cert.p12

      # Zealot is only reachable on the tailnet. Joins as an ephemeral node tagged tag:ci.
      - name: Join tailnet
        if: steps.secrets.outputs.configured == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Build ad hoc IPA and upload to Zealot
        if: steps.secrets.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ZEALOT_TOKEN: ${{ secrets.ZEALOT_TOKEN }}
          ZEALOT_RESOLVE_IP: 100.89.126.77   # chief's tailnet IP (Caddy)
          ZEALOT_RESULT_FILE: /tmp/zealot_url
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
        run: bundle exec fastlane pr_adhoc

      - name: Comment on PR
        if: steps.secrets.outputs.configured == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('/tmp/zealot_url', 'utf8').trim();
            const pr = context.issue.number;
            const marker = '<!-- zealot-build -->';
            const body = [
              marker,
              `**Ad hoc build ready on Zealot:** ${url}`,
              '',
              `Open the link on your iPhone (on the tailnet) and tap Install. It installs as`,
              `**JT PR${pr}** (\`visceralorigami.JumpTuner.pr${pr}\`), alongside the TestFlight app`,
              `and other PR builds. Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
            }
