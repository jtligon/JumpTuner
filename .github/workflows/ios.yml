name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    # The xcode-27 image has the iOS 27 SDK that App Store Connect requires;
    # macos-latest still tops out at Xcode 26.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -s $(ls -d /Applications/Xcode_27.*.app | sort -V | tail -1)

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
        run: bundle exec fastlane test
